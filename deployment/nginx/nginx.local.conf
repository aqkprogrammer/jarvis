# =============================================================================
# JARVIS Nginx — LOCAL / HTTP-only
# =============================================================================
# Differences from nginx.conf (the production config):
#   * No TLS. nginx.conf's :80 block issues `return 301 https://...` and its
#     :443 block requires certs at /etc/nginx/certs, which do not exist on a
#     fresh checkout — nginx refuses to start.
#   * No `rewrite ^/api/(.*) /$1`. The FastAPI app serves its routes under
#     /api/v1 (settings.API_V1_STR), so stripping the prefix 404s every call.
#   * Relaxed rate limits, since a single local user drives every request.
# =============================================================================

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" rt=$request_time urt="$upstream_response_time"';
    access_log /var/log/nginx/access.log main;

    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   75;
    types_hash_max_size 2048;
    server_tokens       off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 256;
    gzip_types text/plain text/css text/javascript application/json
               application/javascript application/xml image/svg+xml;

    # ── Upstreams ────────────────────────────────────────────────────────────
    # Resolved at request time, not at startup. nginx caches an `upstream`
    # block's DNS lookup for the life of the process, so recreating the backend
    # or frontend container (which gives it a new IP) makes every proxied
    # request 502 until nginx is restarted. Pointing proxy_pass at a variable
    # forces a lookup against Docker's embedded DNS on the TTL below instead.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # ── Shared proxy settings ────────────────────────────────────────────────
    proxy_http_version    1.1;
    proxy_set_header      Host              $host;
    proxy_set_header      X-Real-IP         $remote_addr;
    proxy_set_header      X-Forwarded-For   $proxy_add_x_forwarded_for;
    proxy_set_header      X-Forwarded-Proto $scheme;
    proxy_read_timeout    300s;
    proxy_send_timeout    300s;
    proxy_connect_timeout 10s;
    proxy_buffer_size     16k;
    proxy_buffers         8 16k;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        ''      close;
    }

    server {
        listen 80;
        server_name _;

        client_max_body_size 30M;

        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy        "strict-origin-when-cross-origin" always;

        # ── Backend API — prefix preserved, backend serves /api/v1/* ─────────
        location /api/ {
            set $backend http://jarvis-backend:8000;
            proxy_pass $backend;
        }

        # Voice upload — longer timeout for audio processing
        location /api/v1/voice/transcribe {
            set $backend http://jarvis-backend:8000;
            proxy_pass $backend;
            client_max_body_size 30M;
            proxy_read_timeout 120s;
        }

        # ── WebSockets: /ws/chat/{id} and /ws/presence ───────────────────────
        location /ws/ {
            set $backend http://jarvis-backend:8000;
            proxy_pass $backend;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
            proxy_read_timeout 3600s;
            proxy_send_timeout 3600s;
        }

        # ── Backend health / metrics ─────────────────────────────────────────
        location = /health {
            set $backend http://jarvis-backend:8000;
            proxy_pass $backend/health;
            access_log off;
        }

        location = /metrics {
            set $backend http://jarvis-backend:8000;
            proxy_pass $backend/metrics;
            access_log off;
        }

        # ── Frontend (Next.js) ───────────────────────────────────────────────
        location / {
            set $frontend http://jarvis-frontend:3000;
            proxy_pass $frontend;
            proxy_set_header Upgrade    $http_upgrade;
            proxy_set_header Connection $connection_upgrade;
        }

        location /_next/static/ {
            set $frontend http://jarvis-frontend:3000;
            proxy_pass $frontend;
            expires 1y;
            add_header Cache-Control "public, immutable";
        }

        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
