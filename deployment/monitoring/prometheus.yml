global:
  scrape_interval: 15s
  evaluation_interval: 15s

alerting:
  alertmanagers:
    - static_configs:
        - targets: []

rule_files: []

scrape_configs:
  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: "jarvis-backend"
    static_configs:
      - targets: ["jarvis-backend:8000"]
    metrics_path: "/metrics"

# NOTE: redis:6379 and postgres:5432 do not speak the Prometheus exposition
# format. Scraping them directly only produces permanently-DOWN targets — add
# redis_exporter / postgres_exporter to the compose stack to collect those.
