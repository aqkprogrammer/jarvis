# =============================================================================
# JARVIS Docker Compose — Full Stack
# =============================================================================
# Run from the REPO ROOT so the root .env is picked up:
#   docker compose --env-file .env -f deployment/docker/docker-compose.yml up -d
# (Compose otherwise looks for .env next to this file, not at the repo root.)
# =============================================================================

name: jarvis

x-logging: &default-logging
  driver: "json-file"
  options:
    max-size: "50m"
    max-file: "5"

x-backend-env: &backend-env
  DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://jarvis:jarvis_secret@postgres:5432/jarvis}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
  CELERY_BROKER_URL: ${CELERY_BROKER_URL:-redis://redis:6379/0}
  CELERY_RESULT_BACKEND: ${CELERY_RESULT_BACKEND:-redis://redis:6379/1}
  QDRANT_URL: ${QDRANT_URL:-http://qdrant:6333}
  QDRANT_COLLECTION_MEMORIES: ${QDRANT_COLLECTION_MEMORIES:-jarvis_memories}
  QDRANT_COLLECTION_DOCS: ${QDRANT_COLLECTION_DOCS:-jarvis_documents}
  VECTOR_DIMENSION: ${VECTOR_DIMENSION:-384}
  SECRET_KEY: ${SECRET_KEY:?SECRET_KEY must be set in .env}
  ALGORITHM: ${ALGORITHM:-HS256}
  ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-1440}
  REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-30}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  API_BASE_URL: ${API_BASE_URL:-http://localhost}
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  GROQ_API_KEY: ${GROQ_API_KEY:-}
  GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
  ELEVENLABS_API_KEY: ${ELEVENLABS_API_KEY:-}
  ASSEMBLYAI_API_KEY: ${ASSEMBLYAI_API_KEY:-}
  DEEPGRAM_API_KEY: ${DEEPGRAM_API_KEY:-}
  DEFAULT_AI_PROVIDER: ${DEFAULT_AI_PROVIDER:-anthropic}
  DEFAULT_MODEL: ${DEFAULT_MODEL:-claude-sonnet-4-6}
  CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost,http://localhost:3000}
  ALLOWED_HOSTS: ${ALLOWED_HOSTS:-*}
  LOG_LEVEL: ${LOG_LEVEL:-INFO}
  # gunicorn worker count; each one loads torch, so keep it modest locally
  WEB_CONCURRENCY: ${WEB_CONCURRENCY:-2}
  # `development` lets the app build its schema via SQLAlchemy create_all().
  # database/schemas/*.sql has drifted from the ORM models (UUID vs int PKs,
  # missing columns), so it is NOT mounted as a Postgres init script.
  ENVIRONMENT: ${ENVIRONMENT:-development}

services:

  # ---------------------------------------------------------------------------
  # PostgreSQL
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: jarvis-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: jarvis
      POSTGRES_USER: jarvis
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-jarvis_secret}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U jarvis -d jarvis"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - jarvis-internal
      - jarvis-external
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Redis
  # ---------------------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: jarvis-redis
    restart: unless-stopped
    command: >
      redis-server
      --maxmemory 512mb
      --maxmemory-policy allkeys-lru
      --save 60 1
      --loglevel warning
    volumes:
      - redis_data:/data
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    networks:
      - jarvis-internal
      - jarvis-external
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Qdrant (vector store)
  # ---------------------------------------------------------------------------
  qdrant:
    image: qdrant/qdrant:v1.9.2
    container_name: jarvis-qdrant
    restart: unless-stopped
    environment:
      QDRANT__SERVICE__HTTP_PORT: 6333
      QDRANT__SERVICE__GRPC_PORT: 6334
    volumes:
      - qdrant_data:/qdrant/storage
    ports:
      - "127.0.0.1:${QDRANT_HTTP_PORT:-6333}:6333"
      - "127.0.0.1:${QDRANT_GRPC_PORT:-6334}:6334"
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/6333 && printf 'GET /healthz HTTP/1.1\r\nHost: localhost\r\nConnection: close\r\n\r\n' >&3 && grep -q '200 OK' <&3"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks:
      - jarvis-internal
      - jarvis-external
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Backend (FastAPI)
  # ---------------------------------------------------------------------------
  jarvis-backend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.backend
      target: production
    image: jarvis-backend:latest
    container_name: jarvis-backend
    restart: unless-stopped
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      qdrant:
        condition: service_healthy
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - backend_uploads:/app/uploads
      - backend_logs:/app/logs
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/health || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - jarvis-internal
      - jarvis-external
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Frontend (Next.js)
  # ---------------------------------------------------------------------------
  jarvis-frontend:
    build:
      context: ../..
      dockerfile: deployment/docker/Dockerfile.frontend
      target: production
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost}
    image: jarvis-frontend:latest
    container_name: jarvis-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-ws://localhost}
    depends_on:
      - jarvis-backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000 >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - jarvis-internal
      - jarvis-external
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Celery Worker
  # ---------------------------------------------------------------------------
  celery-worker:
    image: jarvis-backend:latest
    container_name: jarvis-celery-worker
    restart: unless-stopped
    command: >
      celery -A backend.app.services.celery_app worker
      --loglevel=info
      --concurrency=4
      --queues=default,memory,agents
      --hostname=worker@%h
    environment:
      <<: *backend-env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - backend_uploads:/app/uploads
    healthcheck:
      test: ["CMD-SHELL", "celery -A backend.app.services.celery_app inspect ping -d worker@$$HOSTNAME"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 30s
    networks:
      - jarvis-internal
      - jarvis-external
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Celery Beat (scheduler)
  # ---------------------------------------------------------------------------
  celery-beat:
    image: jarvis-backend:latest
    container_name: jarvis-celery-beat
    restart: unless-stopped
    command: >
      celery -A backend.app.services.celery_app beat
      --loglevel=info
      --scheduler=redbeat.RedBeatScheduler
    environment:
      <<: *backend-env
      # RedBeat reads `redbeat_redis_url` from the Celery config, not from the
      # environment, so it actually stores its schedule on the broker DB. This
      # var is kept only so the healthcheck below has a single source of truth.
      REDBEAT_REDIS_URL: ${CELERY_BROKER_URL:-redis://redis:6379/1}
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD-SHELL
        - "python -c \"import os,redis,sys; sys.exit(0 if redis.from_url(os.environ['REDBEAT_REDIS_URL']).exists('redbeat::schedule') else 1)\""
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - jarvis-internal
      - jarvis-external
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Nginx (reverse proxy)
  # ---------------------------------------------------------------------------
  nginx:
    image: nginx:1.25-alpine
    container_name: jarvis-nginx
    restart: unless-stopped
    ports:
      - "${NGINX_PORT:-80}:80"
    volumes:
      - ./../nginx/${NGINX_CONF:-nginx.local.conf}:/etc/nginx/nginx.conf:ro
      - nginx_certs:/etc/nginx/certs
      - nginx_logs:/var/log/nginx
    depends_on:
      - jarvis-backend
      - jarvis-frontend
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/health >/dev/null || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
    networks:
      - jarvis-external
      - jarvis-internal
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Prometheus
  # ---------------------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: jarvis-prometheus
    restart: unless-stopped
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--storage.tsdb.retention.time=30d"
      - "--web.enable-lifecycle"
    volumes:
      - prometheus_data:/prometheus
      - ./../../deployment/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - jarvis-internal
      - jarvis-external
    logging: *default-logging

  # ---------------------------------------------------------------------------
  # Grafana
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: jarvis-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_SERVER_ROOT_URL: ${GRAFANA_ROOT_URL:-http://localhost:3001}
      GF_AUTH_ANONYMOUS_ENABLED: "false"
    volumes:
      - grafana_data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - prometheus
    networks:
      - jarvis-internal
      - jarvis-external
    logging: *default-logging

# =============================================================================
# Networks
# =============================================================================

networks:
  # Service-to-service traffic. `internal: true` blocks egress to the internet.
  jarvis-internal:
    driver: bridge
    internal: true
  # Required by any service that publishes a host port or calls out to the
  # internet: Docker configures no NAT for an internal-only network, so a
  # published port on an internal-only container is silently unreachable.
  jarvis-external:
    driver: bridge

# =============================================================================
# Volumes
# =============================================================================

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  qdrant_data:
    driver: local
  backend_uploads:
    driver: local
  backend_logs:
    driver: local
  nginx_certs:
    driver: local
  nginx_logs:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local
